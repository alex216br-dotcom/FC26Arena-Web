{% extends "base.html" %}{% block content %}<section class="container section"><h1>Notificações</h1>{% for n in notifications %}<div class="panel"><strong>{{ n.subject }}</strong><p>{{ n.body }}</p><small class="muted">{{ n.channel }} · {{ n.created_at.strftime('%d/%m/%Y %H:%M') }}</small></div>{% else %}<div class="panel">Nenhuma notificação.</div>{% endfor %}</section>{% endblock %}
