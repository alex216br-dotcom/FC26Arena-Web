{% extends "base.html" %}{% block content %}<div class="card form"><h2>Criar conta</h2>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp" required></div><div class="field"><label>E-mail</label><input type="email" name="email"></div><div class="field"><label>ID EA</label><input name="ea_id" required></div><div class="field"><label>Geração</label><select name="generation"><option value="nova">Nova geração</option><option value="antiga">Antiga geração</option></select></div><div class="field"><label>Plataforma</label><input name="platform" required></div><div class="field"><label>Senha</label><input type="password" name="password" minlength="6" required></div><button class="btn primary">Criar conta</button></form></div>{% endblock %}
