{% extends "base.html" %}{% block content %}<div class="card form"><h2>🆓 Garantir minha vaga</h2><p>As divisões jogam campeonatos separados. Escolha corretamente.</p>{% for e in errors %}<div class="alert">{{ e }}</div>{% endfor %}<form method="post">
<div class="field"><label>Nome do jogador</label><input name="name" required></div><div class="field"><label>WhatsApp com DDD</label><input name="whatsapp" placeholder="41999999999" required></div><div class="field"><label>ID EA Sports</label><input name="ea_id" required></div>
<div class="field"><label>Divisão</label><select name="division" id="division"><option value="nova">Nova geração</option><option value="antiga">Antiga geração</option></select></div><div class="field"><label>Plataforma</label><select name="platform" id="platform"></select></div><div class="field"><label>Crie uma senha</label><input type="password" name="password" minlength="6" required></div>
<div class="field"><label><input type="checkbox" name="accept_rules" value="1" required> Li e aceito o regulamento.</label></div><button class="btn primary" style="width:100%">🚀 FINALIZAR INSCRIÇÃO</button></form></div>
<script>const opts={nova:["PlayStation 5","Xbox Series X|S","PC"],antiga:["PlayStation 4","Xbox One"]};const d=document.getElementById("division"),p=document.getElementById("platform");function up(){p.innerHTML="";opts[d.value].forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;p.appendChild(o)})}d.addEventListener("change",up);d.value="{{ selected if selected in ['nova','antiga'] else 'nova' }}";up();</script>{% endblock %}
