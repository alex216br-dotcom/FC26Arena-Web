{% extends "base.html" %}{% block content %}<section class="container section"><h2>Painel administrativo V5</h2>{% if message %}<div class="alert success">{{ message }}</div>{% endif %}<div class="card"><h3>Criar novo campeonato</h3><form method="post" action="/admin/torneios"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Modalidade</label><select name="mode"><option>1x1</option><option>2x2</option><option>Pro Clubs</option></select></div><div class="field"><label>Geração</label><select name="generation"><option value="nova">Nova geração</option><option value="antiga">Antiga geração</option></select></div><div class="field"><label>Máximo de inscrições</label><input type="number" name="max_entries" value="32"></div><div class="field"><label>Tamanho do grupo</label><input type="number" name="group_size" value="4"></div><div class="field"><label>Taxa</label><input type="number" step="0.01" name="registration_fee" value="0"></div><div class="field"><label>Premiação</label><input type="number" step="0.01" name="prize" value="50"></div><div class="field"><label>Data</label><input name="starts_at" value="A definir"></div><div class="field"><label>Regulamento</label><textarea name="rules"></textarea></div><button class="btn primary">Criar campeonato</button></form></div><h2>Campeonatos</h2><div class="grid">{% for t in tournaments %}<div class="card"><h3>{{ t.name }}</h3><p>{{ t.mode }} · {{ t.status }}</p><a class="btn" href="/torneio/{{ t.slug }}">Abrir</a></div>{% endfor %}</div></section>{% endblock %}
