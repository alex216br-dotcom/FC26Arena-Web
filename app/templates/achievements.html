{% extends "base.html" %}{% block content %}<section class="container section"><h1>Conquistas</h1><div class="cards">{% for a in achievements %}<div class="panel" style="opacity:{{ 1 if a.id in owned else 0.45 }}"><div style="font-size:40px">{{ a.icon }}</div><h3>{{ a.name }}</h3><p>{{ a.description }}</p><span class="badge">+{{ a.xp_reward }} XP</span></div>{% endfor %}</div></section>{% endblock %}
